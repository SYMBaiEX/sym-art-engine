<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYM Studio</title>
<style>
:root{--bg:#0d0b12;--panel:#16131f;--panel2:#1e1a2b;--line:#2d2740;--text:#e8e4f4;--dim:#8d84a8;--accent:#8b5cf6;--accent2:#a78bfa;--bad:#f87171;--good:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;color:var(--accent2);letter-spacing:.06em}
header .proj{color:var(--dim)}
header .spacer{flex:1}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;width:150px}
main{flex:1;display:grid;grid-template-columns:280px 1fr 330px;min-height:0}
.col{overflow-y:auto;padding:14px;min-height:0}
.col.left{border-right:1px solid var(--line);background:var(--panel)}
.col.right{border-left:1px solid var(--line);background:var(--panel)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.center img{max-width:min(90%,640px);max-height:70vh;border-radius:16px;border:1px solid var(--line);background:#000}
.cat{margin-bottom:12px}
.cat label{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:4px}
.cat select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.cat select option:disabled{color:#665f80}
.cat .iso{cursor:pointer;color:var(--dim)}
.cat .iso.active{color:var(--accent2)}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:16px 0 8px}
h3:first-child{margin-top:0}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.score .v{font-size:20px;font-weight:600;color:var(--accent2)}
.score .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.msg{border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:6px;border:1px solid}
.msg.bad{color:var(--bad);border-color:#5b2530;background:#2a1218}
.msg.good{color:var(--good);border-color:#1d4a2c;background:#0f2317}
.msg.warn{color:var(--warn);border-color:#4a3c12;background:#231c08}
.stack{font:12px ui-monospace,monospace}
.stack .row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px}
.stack .row:hover{background:var(--panel2)}
.stack .ord{color:var(--accent2);width:40px}
.stack .slot{flex:1;color:var(--text)}
.stack .meta{color:var(--dim);font-size:10px}
.stack input{accent-color:var(--accent)}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;color:#c9c2e0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--dim);margin:2px}
.saved{color:var(--good);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>SYM STUDIO</h1><span class="proj" id="projName"></span>
  <span class="spacer"></span>
  <input type="text" id="seedInput" placeholder="seed (optional)">
  <button id="randomBtn" class="primary">Randomize</button>
  <button id="saveBtn">Save preview</button>
  <span class="saved" id="savedMsg"></span>
</header>
<main>
  <div class="col left" id="categories"></div>
  <div class="center">
    <img id="preview" alt="preview">
    <div id="modeHint" style="color:var(--dim);font-size:12px"></div>
  </div>
  <div class="col right">
    <h3>Combination score</h3>
    <div class="score-grid">
      <div class="score"><div class="v" id="overallScore">–</div><div class="k">Overall</div></div>
      <div class="score"><div class="v" id="paletteScore">–</div><div class="k">Palette</div></div>
      <div class="score"><div class="v" id="synergyScore">–</div><div class="k">Synergy</div></div>
      <div class="score"><div class="v" id="validScore">–</div><div class="k">Rules</div></div>
    </div>
    <div id="messages" style="margin-top:10px"></div>
    <h3>Render stack (top → bottom)</h3>
    <div class="stack" id="stack"></div>
    <h3>Inspect</h3>
    <div class="tabs">
      <button data-tab="metadata" class="active">Metadata</button>
      <button data-tab="dna">DNA</button>
    </div>
    <pre id="inspect"></pre>
  </div>
</main>
<script>
const state = { project: null, selection: {}, hidden: new Set(), isolate: null, evalData: null, tab: 'metadata' };

const qs = (s) => document.querySelector(s);

function selectionParam() {
  return Object.entries(state.selection).filter(([,v]) => v).map(([c,t]) => c + ':' + t).join(',');
}

async function loadProject() {
  state.project = await (await fetch('/api/project')).json();
  qs('#projName').textContent = state.project.name;
  document.title = 'SYM Studio — ' + state.project.name;
  for (const cat of state.project.categories) {
    if (!(cat.id in state.selection)) {
      const first = state.project.traits.find(t => t.category === cat.id);
      state.selection[cat.id] = first ? first.id : null;
    }
  }
  renderCategories();
  refresh();
}

function renderCategories() {
  const host = qs('#categories');
  host.innerHTML = '';
  for (const cat of state.project.categories) {
    const traits = state.project.traits.filter(t => t.category === cat.id);
    const wrap = document.createElement('div');
    wrap.className = 'cat';
    const label = document.createElement('label');
    const isoActive = state.isolate === cat.id;
    label.innerHTML = `<span>${cat.name}</span><span class="iso${isoActive ? ' active' : ''}" data-iso="${cat.id}" title="isolated view">◧ isolate</span>`;
    const select = document.createElement('select');
    const off = document.createElement('option');
    off.value = ''; off.textContent = '(off)';
    select.appendChild(off);
    const opts = state.evalData ? state.evalData.options[cat.id] : null;
    for (const t of traits) {
      const o = document.createElement('option');
      o.value = t.id;
      const blocked = opts && opts.find(x => x.id === t.id)?.blocked;
      o.textContent = t.name + (t.tier ? ` · ${t.tier}` : '') + (blocked ? ' ⛔' : '');
      if (blocked) { o.disabled = state.selection[cat.id] !== t.id; o.title = blocked; }
      select.appendChild(o);
    }
    select.value = state.selection[cat.id] || '';
    select.onchange = () => { state.selection[cat.id] = select.value || null; refresh(); };
    label.querySelector('.iso').onclick = () => {
      state.isolate = state.isolate === cat.id ? null : cat.id;
      renderCategories(); refresh();
    };
    wrap.appendChild(label);
    wrap.appendChild(select);
    host.appendChild(wrap);
  }
}

async function refresh() {
  const sel = selectionParam();
  const img = qs('#preview');
  const params = new URLSearchParams({ traits: sel });
  if (state.hidden.size) params.set('hide', [...state.hidden].join(','));
  if (state.isolate) params.set('isolate', state.isolate);
  img.src = '/api/render?' + params + '&_=' + Date.now();
  qs('#modeHint').textContent = state.isolate
    ? 'Isolated view: only the ' + state.isolate + ' trait, over checkerboard'
    : 'Cumulative view: full composite';

  state.evalData = await (await fetch('/api/evaluate?traits=' + encodeURIComponent(sel))).json();
  const ev = state.evalData;
  qs('#overallScore').textContent = ev.overall;
  qs('#paletteScore').textContent = ev.palette.score;
  qs('#synergyScore').textContent = (ev.synergy.score >= 0 ? '+' : '') + ev.synergy.score;
  qs('#validScore').textContent = ev.valid ? 'OK' : 'FAIL';
  qs('#validScore').style.color = ev.valid ? 'var(--good)' : 'var(--bad)';

  const msgs = qs('#messages');
  msgs.innerHTML = '';
  for (const v of ev.violations) msgs.innerHTML += `<div class="msg bad">⛔ ${v.message}</div>`;
  for (const m of ev.synergy.matches) msgs.innerHTML += `<div class="msg good">✦ ${m.name} (+${m.score})</div>`;
  for (const d of ev.palette.discouraged) msgs.innerHTML += `<div class="msg warn">◮ palette discouraged: ${d}</div>`;
  for (const b of ev.palette.blocked) msgs.innerHTML += `<div class="msg bad">⛔ palette blocked: ${b}</div>`;
  for (const p of ev.palette.preferred) msgs.innerHTML += `<div class="msg good">✦ palette preferred: ${p}</div>`;

  const stack = qs('#stack');
  stack.innerHTML = '';
  for (const row of [...ev.renderPlan].reverse()) {
    const div = document.createElement('div');
    div.className = 'row';
    const checked = state.hidden.has(row.slot) ? '' : 'checked';
    div.innerHTML = `<input type="checkbox" ${checked} data-slot="${row.slot}">
      <span class="ord">${String(row.order).padStart(4,'0')}</span>
      <span class="slot">${row.slot.replace(/^\d+_/,'')}<div class="meta">${row.file} · ${row.trait} · α${row.opacity} · ${row.blend}</div></span>`;
    div.querySelector('input').onchange = (e) => {
      if (e.target.checked) state.hidden.delete(row.slot); else state.hidden.add(row.slot);
      refresh();
    };
    stack.appendChild(div);
  }

  qs('#inspect').textContent = state.tab === 'metadata'
    ? JSON.stringify(ev.metadata, null, 2)
    : ev.dnaSource + '\n\nsha256: ' + ev.dna;

  renderCategories();
}

qs('#randomBtn').onclick = async () => {
  const seed = qs('#seedInput').value.trim();
  const res = await (await fetch('/api/random' + (seed ? '?seed=' + encodeURIComponent(seed) : ''))).json();
  if (res.traits) { state.selection = { ...state.selection, ...res.traits }; refresh(); }
};

qs('#saveBtn').onclick = async () => {
  const res = await (await fetch('/api/save?traits=' + encodeURIComponent(selectionParam()), { method: 'POST' })).json();
  qs('#savedMsg').textContent = res.file ? 'saved ✓' : (res.error || 'failed');
  setTimeout(() => qs('#savedMsg').textContent = '', 3000);
};

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  state.tab = b.dataset.tab;
  refresh();
});

loadProject();
</script>
</body>
</html>
